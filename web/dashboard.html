<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Dashboard roadmap</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="stylesheet" href="style.css?v=20261002s">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <main>
    <div class="page-head">
      <h1 class="page-title">Dashboard Tareas</h1>
      <button type="button" class="tertiary noprint" id="pdf" hidden>Descargar PDF</button>
    </div>
    <div class="card" id="gate" hidden>
      <h2>Dashboard de tareas</h2>
      <p class="hint">Introduce tu clave de acceso. Si tienes problemas, ponte en contacto con <a href="mailto:borja.conde@mendesaltaren.com">borja.conde@mendesaltaren.com</a></p>
      <div class="row">
        <div class="field">
          <input id="key" type="password" autocomplete="off" placeholder="Clave" aria-describedby="key-error">
          <p class="field-error" id="key-error" role="alert" hidden></p>
        </div>
        <button id="saveKey">Entrar</button>
      </div>
    </div>
    <div id="root"></div>
  </main>
  <script src="js/config.js?v=20261002s"></script>
  <script src="js/loading.js?v=20261002s"></script>
  <script src="js/api.js?v=20261002s"></script>
  <script src="js/dashboard.js?v=20261002s"></script>
  <script src="js/tasktable.js?v=20261002s"></script>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      const root = $('root');

      // Acceso: enlace dashboard.html#c=Cliente&k=CLAVE (el fragmento no viaja al servidor),
      // o la clave de administrador tecleada aquí. Queda recordado en este navegador.
      const SAVED = 'dashboardAccess';
      const saved = {
        get: () => { try { return JSON.parse(localStorage.getItem(SAVED)) || {}; } catch { return {}; } },
        set: (v) => { try { localStorage.setItem(SAVED, JSON.stringify(v)); } catch {} },
        clear: () => { try { localStorage.removeItem(SAVED); } catch {} },
      };

      function keyError(msg) {
        $('key-error').textContent = msg || '';
        $('key-error').hidden = !msg;
        if (msg) $('key').setAttribute('aria-invalid', 'true'); else $('key').removeAttribute('aria-invalid');
      }
      const BAD_KEY = 'Clave incorrecta o enlace caducado. Si eres cliente, usa el enlace que te enviaron.';

      // Chart.js se carga diferido para no retrasar la petición de datos: se espera a que esté listo antes de dibujar.
      const domReady = new Promise((r) => (document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r()));

      // Carga el dashboard con el acceso dado. Devuelve true si todo fue bien.
      // Si ya hay una copia guardada, se dibuja al instante y se refresca en segundo plano (sin bloquear la página).
      async function open(access) {
        // La copia va ligada al cliente y a la clave con la que se leyó: un enlace distinto no la ve.
        const cacheName = `dashboard:${access.c || '*'}:${access.k}`;
        const cached = directMode ? null : dataCache.get(cacheName);
        let view = null;
        const render = async (tasks) => {
          await domReady;
          if (view) return view.setData(tasks);
          $('gate').hidden = true;
          root.innerHTML = '';
          view = mount(root, tasks, { onReload: reload });
        };
        // Botón «Recargar»: vuelve a leer los datos con el acceso actual, bloqueando la página mientras tanto.
        const reload = async () => {
          try {
            const tasks = await Loading.wrap('Recargando el dashboard…', () => getClientTasks(access.c || '', access.k || ''));
            await render(tasks);
            if (!directMode) dataCache.set(cacheName, tasks);
            setStatus(directMode ? '' : `Datos actualizados a las ${hhmm(Date.now())}`);
          } catch (e) {
            setStatus(`No se pudo recargar: ${e.message}`);
          }
        };
        try {
          const fetchTasks = () => getClientTasks(access.c || '', access.k || '');
          if (cached) {
            await render(cached.data);
            setStatus('Actualizando…');
          }
          const tasks = cached ? await fetchTasks() : await Loading.wrap('Cargando el dashboard…', fetchTasks);
          if (!cached || JSON.stringify(tasks) !== JSON.stringify(cached.data)) await render(tasks);
          if (!directMode) { dataCache.set(cacheName, tasks); saved.set(access); }
          setStatus(directMode ? '' : `Datos actualizados a las ${hhmm(Date.now())}`);
          return true;
        } catch (e) {
          if (e.status === 401) { saved.clear(); dataCache.clear(cacheName); }
          else if (cached && view) {
            setStatus(`No se pudo actualizar: ${e.message} Se muestran los datos guardados de las ${hhmm(cached.t)}.`);
            return true;
          }
          root.innerHTML = '';
          $('gate').hidden = false;
          keyError(e.status === 401 ? BAD_KEY : e.message);
          return false;
        }
      }

      async function enter() {
        const k = $('key').value.trim();
        if (!k) return keyError('Introduce la clave de acceso.');
        keyError('');
        await open({ c: '', k });
      }
      $('saveKey').onclick = enter;
      $('key').onkeydown = (e) => { if (e.key === 'Enter') enter(); };
      $('key').oninput = () => keyError('');

      const hash = new URLSearchParams(location.hash.slice(1));
      const access = hash.get('k') ? { c: hash.get('c') || '', k: hash.get('k') } : saved.get();
      if (directMode || access.k) open(access);
      else $('gate').hidden = false;
    })();
  </script>
</body>
</html>
