<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Dashboard roadmap</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top"><h1 id="title">Roadmap de Producto y Diseño</h1>
    <button class="ghost noprint" style="margin-left:auto" onclick="print()">Imprimir / PDF</button></header>
  <main id="root"></main>
  <script src="js/config.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/snapshot.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    (async () => {
      // Acceso solo por enlace: dashboard.html#c=NombreCliente&k=CLAVE  (el fragmento no viaja al servidor)
      // Tras abrirlo una vez con el enlace, el acceso queda recordado en este navegador.
      const SAVED = 'dashboardAccess';
      const saved = {
        get: () => { try { return JSON.parse(localStorage.getItem(SAVED)) || {}; } catch { return {}; } },
        set: (v) => { try { localStorage.setItem(SAVED, JSON.stringify(v)); } catch {} },
        clear: () => { try { localStorage.removeItem(SAVED); } catch {} },
      };
      const hash = new URLSearchParams(location.hash.slice(1));
      const fromLink = !!(hash.get('c') && hash.get('k'));
      const access = fromLink ? { c: hash.get('c'), k: hash.get('k') } : saved.get();
      const client = access.c || '', key = access.k || '';
      if (client) document.getElementById('title').textContent = `Roadmap de Producto y Diseño · ${client}`;
      const root = document.getElementById('root');
      if (!directMode && (!client || !key)) {
        root.innerHTML = '<p id="err" class="msg err"></p>';
        return showError('Esta página solo se abre con el enlace de acceso que te facilitó el administrador.');
      }
      try {
        mount(root, await Loading.wrap('Cargando el dashboard…', () => getClientTasks(client, key)));
        if (fromLink && !directMode) saved.set(access);
      } catch (e) {
        if (e.status === 401) saved.clear();
        root.innerHTML = '<p id="err" class="msg err"></p>';
        showError(e.status === 401 ? 'Enlace no válido o caducado.' : e.message);
      }
    })();
  </script>
</body>
</html>
