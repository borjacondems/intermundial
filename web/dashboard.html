<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard roadmap</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>Roadmap de Producto y Diseño</h1>
    <nav><a href="index.html">Nueva iniciativa</a><a class="on" href="dashboard.html">Dashboard</a></nav>
  </header>
  <main id="root"></main>
  <script src="js/config.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/snapshot.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    (async () => {
      const root = document.getElementById('root');
      if (!directMode && !teamKey.get()) return location.replace('index.html');
      try {
        mount(root, await Loading.wrap('Cargando el dashboard…', getTasks), { internal: true });
      } catch (e) {
        if (e.status === 401) { teamKey.set(''); return location.replace('index.html'); }
        root.innerHTML = '<p id="err" class="msg err"></p>';
        showError(e.message);
      }
    })();
  </script>
</body>
</html>
