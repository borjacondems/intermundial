<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Roadmap de Producto y Diseño</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top"><h1 id="title">Roadmap de Producto y Diseño</h1>
    <button class="ghost noprint" style="margin-left:auto" onclick="print()">Imprimir / PDF</button></header>
  <main id="root"></main>
  <script src="js/config.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/snapshot.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    (async () => {
      // Enlace: cliente.html#c=NombreCliente&k=CLAVE  (el fragmento no viaja al servidor)
      const hash = new URLSearchParams(location.hash.slice(1));
      const client = hash.get('c') || '', key = hash.get('k') || '';
      if (client) document.getElementById('title').textContent = `Roadmap de Producto y Diseño · ${client}`;
      const root = document.getElementById('root');
      try {
        mount(root, await Loading.wrap('Cargando el dashboard…', () => getClientTasks(client, key)));
      } catch (e) {
        root.innerHTML = '<p id="err" class="msg err"></p>';
        showError(e.status === 401 ? 'Enlace no válido o caducado.' : e.message);
      }
    })();
  </script>
</body>
</html>
