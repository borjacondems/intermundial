<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de roadmap</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Roadmap de Producto y Diseño</h1>
  </header>
  <main>
    <div class="card" id="gate" hidden>
      <h2>Clave de equipo</h2>
      <p class="hint">Pídesela a quien administre el proyecto. Se guarda solo en este navegador.</p>
      <div class="row">
        <div class="field">
          <input id="key" type="password" autocomplete="off" placeholder="Clave" aria-describedby="key-error">
          <p class="field-error" id="key-error" role="alert" hidden></p>
        </div>
        <button id="saveKey">Entrar</button>
      </div>
    </div>

    <div class="card" id="app" hidden>
      <h2>Nueva iniciativa</h2>
      <p class="msg err" id="offline" hidden>El backend (Apps Script) aún no está configurado: no se puede guardar en la hoja. Sigue los pasos del README y pon la URL <code>/exec</code> en <code>js/config.js</code>.</p>
      <form class="task" id="form">
        <div class="full"><label for="iniciativa">Iniciativa *</label><input id="iniciativa" required maxlength="200"></div>
        <div><label for="proyecto">Proyecto *</label><select id="proyecto" required></select></div>
        <div><label for="area">Área</label><select id="area"></select></div>
        <div><label for="estado">Estado</label><select id="estado"></select></div>
        <div class="full"><label for="tamano">Tamaño (small = 1 pt · medium = 2 · large = 3)</label><select id="tamano"></select></div>
        <div class="full"><label for="nota">Nota</label><textarea id="nota" rows="3" maxlength="1900"></textarea></div>
        <div class="full"><button id="submit" type="submit">Guardar iniciativa</button>
          <div class="msg" id="msg" role="status"></div></div>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/loading.js"></script>
  <script src="js/api.js"></script>
  <script>

    const PROYECTOS = ['Tienda online', 'Safer', 'App/AC'];
    const AREAS = ['Producto', 'Diseño'];
    const ESTADOS = ['En curso', 'Hecho', 'Bloqueado'];
    const TAMANOS = ['small', 'medium', 'large', 'TBD', 'Incluido'];
    const $ = (id) => document.getElementById(id);
    const fill = (id, vals) => { $(id).innerHTML = vals.map((v) => `<option>${v}</option>`).join(''); };
    fill('proyecto', PROYECTOS);
    $('proyecto').insertAdjacentHTML('afterbegin', '<option value="">Selecciona un proyecto</option>');
    $('proyecto').value = '';
    fill('area', AREAS); fill('estado', ESTADOS); fill('tamano', TAMANOS);
    $('estado').insertAdjacentHTML('afterbegin', '<option value="">Sin estado</option>');
    $('estado').value = '';

    function show(loggedIn) {
      $('gate').hidden = loggedIn;
      $('app').hidden = !loggedIn;
    }

    // Mensaje de error bajo el campo de clave (estado de error del Text Input: borde rojo + texto de ayuda).
    function keyError(msg) {
      $('key-error').textContent = msg || '';
      $('key-error').hidden = !msg;
      if (msg) $('key').setAttribute('aria-invalid', 'true'); else $('key').removeAttribute('aria-invalid');
    }
    const BAD_KEY = 'Clave incorrecta. Revísala e inténtalo de nuevo.';

    // Comprueba la clave leyendo la hoja (el formulario ya no necesita sus datos). Devuelve true si es válida.
    // blocking=false: comprobación silenciosa en segundo plano, sin overlay.
    async function load(blocking = true, label = 'Cargando…') {
      try {
        await (blocking ? Loading.wrap(label, getTasks) : getTasks());
        dataCache.set('session', true);
        return true;
      } catch (e) {
        if (e.status === 401) { teamKey.set(''); dataCache.clear('session'); show(false); keyError(BAD_KEY); }
        else if (!$('gate').hidden) keyError(e.message);
        else $('msg').textContent = e.message;
        return false;
      }
    }

    // La clave se comprueba antes de mostrar el formulario.
    async function enter() {
      const k = $('key').value.trim();
      if (!k) return keyError('Introduce la clave de equipo.');
      keyError('');
      teamKey.set(k);
      if (await load(true, 'Comprobando clave…')) show(true);
      else teamKey.set('');
    }
    $('saveKey').onclick = enter;
    $('key').onkeydown = (e) => { if (e.key === 'Enter') enter(); };
    $('key').oninput = () => keyError('');

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
      $('submit').disabled = true;
      Loading.show('Guardando iniciativa…');
      try {
        await createTask({
          iniciativa: $('iniciativa').value, proyecto: $('proyecto').value,
          area: $('area').value, estado: $('estado').value, tamano: $('tamano').value, nota: $('nota').value,
        });
        msg.className = 'msg ok'; msg.textContent = 'Iniciativa guardada en la hoja.';
        for (const id of ['iniciativa', 'nota']) $(id).value = ''; // el proyecto se conserva para cargar varias seguidas
      } catch (err) {
        if (err.status === 401) { teamKey.set(''); dataCache.clear('session'); show(false); keyError(BAD_KEY); }
        msg.className = 'msg err'; msg.textContent = err.message;
      } finally { Loading.hide(); $('submit').disabled = directMode; }
    };

    // Sin backend no hay clave que pedir: se muestra el formulario deshabilitado.
    if (directMode) {
      $('offline').hidden = false;
      $('submit').disabled = true;
    }
    if (directMode) { show(true); load(); }
    else if (teamKey.get()) {
      // Clave ya comprobada antes: el formulario sale al instante y la clave se valida en segundo plano
      // (si ya no vale, vuelve a la pantalla de clave con el error).
      if (dataCache.get('session')) { show(true); load(false); }
      else load().then(show);
    } else show(false);
  </script>
</body>
</html>
